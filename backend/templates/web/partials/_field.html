<div>
  <label for="{{ field.id_for_label }}" class="mb-1.5 block text-sm font-medium text-plum-800">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<div class="mt-1.5 text-xs leading-6 text-plum-900/50 [&_ul]:list-disc [&_ul]:ps-5">{{ field.help_text|safe }}</div>{% endif %}
  {% for e in field.errors %}<p class="mt-1.5 text-sm text-rose-600">{{ e }}</p>{% endfor %}
</div>
